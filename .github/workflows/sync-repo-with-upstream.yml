name: Sync develop branch from upstream

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history required

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/lidofinance/ethereum-validators-monitoring.git
          git fetch upstream

      - name: Checkout develop and merge upstream/develop
        env:
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
        run: |
          git checkout develop
          # Try merge with no-edit so it auto-merges when possible
          git merge upstream/develop --no-edit || (echo "Merge conflict detected" && git status && exit 1)

      - name: Push changes
        env:
          PAT: ${{ secrets.PAT_TO_PUSH_FOR_SYNC }}
        run: |
          git push https://x-access-token:${PAT}@github.com/gateway-fm/stakeway-balval.git HEAD:develop
